[package]
name = "nat64-ebpf"
version = "0.6.0"
edition = "2024"
publish = false

# Outside the FeOS workspace: it builds on nightly for bpfel-unknown-none
# (ADR 0002). `make nat64-bpf` builds it into crates/nat64/bpf/.
[workspace]

[dependencies]
aya-ebpf = "0.2.1"

[[bin]]
name = "nat64"
path = "src/main.rs"

[profile.release]
opt-level = 3
debug = false
lto = true
panic = "abort"
codegen-units = 1

[profile.dev]
panic = "abort"
