[package]
name = "fleet-client"
version.workspace = true
edition.workspace = true
description = "feosd's side of the control plane (ADR 0015): the join, the uplink and the node connections"

[lints]
workspace = true

[dependencies]
feos-proto = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
tonic = { workspace = true }
prost = { workspace = true }
prost-types = { workspace = true }
hyper = { workspace = true, features = ["server", "http1"] }
hyper-util = { workspace = true }
tower = { workspace = true }
log = { workspace = true }
nix = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
sha2 = { workspace = true }
rustls = { workspace = true, features = ["ring", "std", "logging"] }
tokio-rustls = { workspace = true }
rcgen = { workspace = true }
x509-parser = { workspace = true }
pem = { workspace = true }
# OTLP/HTTP's gzip, as the image service's layers.
flate2 = "1.0"

[dev-dependencies]
tempfile = { workspace = true }
# The test control plane reads the node's signing requests.
rcgen = { workspace = true, features = ["x509-parser"] }
