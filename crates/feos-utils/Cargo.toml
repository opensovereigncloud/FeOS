[package]
name = "feos-utils"
version.workspace = true
edition.workspace = true

[lints]
workspace = true

[dependencies]
# "std": feos_logger installs itself with log::set_boxed_logger.
log = { workspace = true, features = ["std"] }
nix = { workspace = true }
chrono = { workspace = true }
tokio = { workspace = true }
termcolor = { workspace = true }
dhcproto = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
netlink-packet-route = { workspace = true, optional = true }
pnet = { workspace = true, optional = true }
rtnetlink = { workspace = true, optional = true }
socket2 = { workspace = true, optional = true }
libc = { workspace = true }

[features]
default = []
git-version = []
# Bare-metal host networking: DHCPv6, router advertisements, SR-IOV.
host = [
    "dep:dhcproto",
    "dep:futures",
    "dep:netlink-packet-route",
    "dep:pnet",
    "dep:rtnetlink",
    "dep:socket2",
]
