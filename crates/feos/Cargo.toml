[package]
name = "feos"
version.workspace = true
edition.workspace = true

[lints]
workspace = true

[[bin]]
name = "feos"
path = "src/main.rs"

[lib]
name = "main_server"
path = "src/lib.rs"

[dependencies]
feos-utils = { workspace = true }
vm-service = { workspace = true, optional = true }
host-service = { workspace = true }
image-service = { workspace = true }
task-service = { workspace = true }
container-service = { workspace = true }
tool-service = { workspace = true, optional = true }
watch-service = { workspace = true, optional = true }
forward-service = { workspace = true, optional = true }
feos-proto = { workspace = true }

# Workspace dependencies
tokio = { workspace = true }
tokio-stream = { workspace = true }
tokio-vsock = { workspace = true, optional = true }
tonic = { workspace = true }
hyper-util = { workspace = true }
tower = { workspace = true }
anyhow = { workspace = true }
log = { workspace = true }
nix = { workspace = true }
prost = { workspace = true }
libc = { workspace = true }

[dev-dependencies]
feos-utils = { workspace = true }
vm-service = { workspace = true }
image-service = { workspace = true }
host-service = { workspace = true }
anyhow = { workspace = true }
nix = { workspace = true }
tokio = { workspace = true }
tonic = { workspace = true }
log = { workspace = true }
tokio-stream = { workspace = true }
prost = { workspace = true }
hyper-util = { workspace = true }
tower = { workspace = true }
tempfile = { workspace = true }

[features]
default = ["host"]
git-version = ["feos-utils/git-version"]
# The node agent: the VM service and the public gRPC API on TCP.
host = ["dep:vm-service"]
# Guest profile: PID 1 in a microVM. The API listens on vsock, FeOS tells
# the host when it is ready, and a data volume holds images and containers.
guest = [
    "host-service/guest",
    "dep:tokio-vsock",
    "dep:tool-service",
    "dep:watch-service",
    "dep:forward-service",
]
