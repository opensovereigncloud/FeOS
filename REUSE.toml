version = 1
SPDX-PackageName = "FeOS"
SPDX-PackageSupplier = "IronCore authors <ospo@sap.com>"
SPDX-PackageDownloadLocation = "https://github.com/ironcore-dev/FeOS"


[[annotations]]
path = [
    ".github/**",
    "CODEOWNERS",
    "Makefile",
    "README.md",
    "Cargo.lock",
    "Cargo.toml",
    ".gitignore",
    "CLAUDE.md",
    "rust-toolchain.toml",
    "rustfmt.toml",
    "**/Cargo.toml",
    "**/*.rs",
    "**/*.sql",
    "**/*.json",
    "**/clippy.toml",
    "**/*.proptest-regressions",
    "proto/**/*.proto",
    "go/go.mod",
    "go/go.sum",
    "go/gen/**",
    "go/internal/ui/dist/.keep",
    "fechat/backend/go.mod",
    "fechat/backend/go.sum"
]
precedence = "aggregate"
SPDX-FileCopyrightText = "SAP SE or an SAP affiliate company and IronCore contributors"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = [
    "hack/**",
    "docs/**",
    "**/README.md",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "SAP SE or an SAP affiliate company and IronCore contributors"
SPDX-License-Identifier = "Apache-2.0"
