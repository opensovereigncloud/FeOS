[workspace]
members = [
    "crates/feos",
    "crates/feos-proto",
    "crates/feos-utils",
    "crates/feosctl",
    "crates/services/container-service",
    "crates/services/host-service",
    "crates/services/image-service",
    "crates/services/task-service",
    "crates/services/vm-service",
]
resolver = "2"

[workspace.lints.clippy]
uninlined_format_args = "warn"

[workspace.package]
version = "0.5.0"
edition = "2021"

[workspace.dependencies]
tokio = { version = "1.47.1", features = ["full"] }
tokio-stream = { version = "0.1.15", features = ["net"] }
tonic = "0.13.0"
prost = "0.13.5"
prost-types = "0.13.5"
anyhow = "1.0.100"
nix = { version = "0.30.1", features = ["mount", "user", "reboot", "feature", "net", "aio", "signal", "process", "fs", "hostname"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.132"
sqlx = { version = "0.8.6", features = ["runtime-tokio-rustls", "sqlite", "macros", "uuid"] }
uuid = { version = "1.18.1", features = ["v4"] }
tonic-build = "0.13.0"
log = "0.4.28"
env_logger = "0.11"
openssl = { version = "0.10.72", features = ["vendored"] }
oci-distribution = "0.11.0"
tempfile = "3.23.0"
tower = { version = "0.5.2", features = ["full"] }
sha2 = "0.10"
hex = "0.4"
digest = "0.10"
clap = { version = "4.5.48", features = ["derive", "env"] }
dotenvy = { version = "0.15"}
libc = "0.2"
rtnetlink = "0.18.1"
netlink-packet-route = "~0.25.0"
pnet = "0.35.0"
dhcproto = "0.13.0"
socket2 = "0.6.0"
futures = "0.3.31"
chrono = "0.4.42"
thiserror = "2.0.16"
hyper = "1.7.0"
hyper-util = { version = "0.1.17", features = ["full"] }
termcolor = "1.1"
once_cell = "1.19"

# Workspace crates
feos-proto = { path = "crates/feos-proto" }
feos-utils = { path = "crates/feos-utils" }
container-service = { path = "crates/services/container-service" }
host-service = { path = "crates/services/host-service" }
image-service = { path = "crates/services/image-service" }
task-service = { path = "crates/services/task-service" }
vm-service = { path = "crates/services/vm-service" }
