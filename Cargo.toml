[workspace]
members = [
    "crates/feos",
    "crates/feos-host-init",
    "crates/feos-proto",
    "crates/feos-utils",
    "crates/feosctl",
    "crates/services/container-service",
    "crates/services/forward-service",
    "crates/services/host-service",
    "crates/services/image-service",
    "crates/services/task-service",
    "crates/services/tool-service",
    "crates/services/watch-service",
    "crates/services/vm-service",
]
resolver = "3"

[workspace.lints.clippy]
uninlined_format_args = "warn"
# tonic::Status is 176 bytes; every gRPC handler returns it.
result_large_err = "allow"

# The guest profile of feos builds into its own directory, so that it does not
# overwrite the host profile's binary: target/<triple>/release-guest/feos.
[profile.release-guest]
inherits = "release"

[workspace.package]
version = "0.6.0"
edition = "2024"

[workspace.dependencies]
tokio = { version = "1.47.1", features = ["rt-multi-thread", "macros", "net", "fs", "io-util", "process", "signal", "sync", "time"] }
tokio-stream = { version = "0.1.15", features = ["net"] }
tokio-vsock = { version = "0.7.2", features = ["tonic013"] }
tonic = "0.13.0"
prost = "0.13.5"
prost-types = "0.13.5"
anyhow = "1.0.100"
nix = { version = "0.30.1", features = ["mount", "user", "reboot", "feature", "net", "aio", "signal", "process", "fs", "hostname", "ioctl"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.132"
# sqlite needs no TLS.
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate", "uuid"] }
uuid = { version = "1.18.1", features = ["v4"] }
tonic-build = "0.13.0"
log = "0.4.28"
env_logger = "0.11"
# youki as a library: cgroup v2 only, no libseccomp (C), no systemd.
libcontainer = { version = "0.7.0", default-features = false, features = ["v2"] }
oci-client = { version = "0.15.0", default-features = false, features = ["rustls-tls"] }
# The one HTTP client, the version oci-client uses. rustls with ring; webpki
# roots for registries and the web, the system's roots for upgrades.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "rustls-tls-native-roots"] }
tempfile = "3.23.0"
tower = { version = "0.5.2", features = ["util"] }
sha2 = "0.10"
clap = { version = "4.5.48", features = ["derive", "env"] }
libc = "0.2"
rtnetlink = "0.18.1"
pnet = "0.35.0"
dhcproto = "0.13.0"
rand = "0.9"
socket2 = "0.6.0"
futures = "0.3.31"
chrono = "0.4.42"
thiserror = "2.0.16"
hyper = "1.7.0"
hyper-util = { version = "0.1.17", features = ["tokio"] }
termcolor = "1.1"

# Workspace crates
feos-proto = { path = "crates/feos-proto" }
feos-utils = { path = "crates/feos-utils" }
container-service = { path = "crates/services/container-service" }
forward-service = { path = "crates/services/forward-service" }
host-service = { path = "crates/services/host-service" }
image-service = { path = "crates/services/image-service" }
task-service = { path = "crates/services/task-service" }
tool-service = { path = "crates/services/tool-service" }
watch-service = { path = "crates/services/watch-service" }
vm-service = { path = "crates/services/vm-service" }
