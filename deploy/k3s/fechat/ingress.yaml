#
# https://chat.fecode.dev: /api to the backend, the rest to the SPA, which is
# static. The backend signs people in with their FeCode ID and answers its
# API to nobody else (backend/auth.go). The certificate comes from
# cert-manager.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fechat
  namespace: fechat
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  rules:
    - host: chat.fecode.dev
      http:
        paths:
          # the more specific route first: the API to the backend
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: fechat-backend
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: fechat-app
                port:
                  number: 8080
  tls:
    - hosts:
        - chat.fecode.dev
      secretName: fechat-tls
