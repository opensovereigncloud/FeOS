# FeRun's control plane on k3s (deploy/k3s/README.md): ferund (ADR 0015)
# and its PostgreSQL. The front doors, REST, MCP and the UI, are
# https://run.<DOMAIN> through traefik; the nodes' port is service
# ferund-nodes, TCP to the instances, never through the ingress: it is mTLS
# end to end. The ${...} in this directory are the deployment's parameters
# (config.env.example): make -C deploy/k3s apply-ferun fills them in.
#
# The secrets are not here; README.md says how to make them:
#   ferun-ca          ferund's CA directory: issuer.crt, issuer.key,
#                     issuer.json, bundle.crt (never root.key)
#   ferund-postgres   password: PostgreSQL's
#   ferund            FERUN_DATABASE_URL, FERUN_ADMIN_USERS,
#                     FERUN_BOOTSTRAP_TOKEN
#   ferund-secret-key key: seals secrets at rest (ADR 0018)
#   oidc-client-ferun client_id, client_secret: ferund's client at the
#                     OpenID Connect provider
apiVersion: v1
kind: Namespace
metadata:
  name: ferun
