# FeRun's control plane on the lab's k3s (deploy/k3s/README.md): ferund
# (ADR 0015) and its PostgreSQL. The front doors, REST, MCP and the UI, are
# https://run.fecode.dev through traefik; the nodes' port is service
# ferund-nodes, TCP to the instances, never through the ingress: it is mTLS
# end to end.
#
# The secrets are not here; README.md says how to make them:
#   ferun-ca          ferund's CA directory: issuer.crt, issuer.key,
#                     issuer.json, bundle.crt (never root.key)
#   ferund-postgres   password: PostgreSQL's
#   ferund            FERUN_DATABASE_URL, FERUN_ADMIN_USERS,
#                     FERUN_BOOTSTRAP_TOKEN
#   oidc-client-ferun ferund's client at id.fecode.dev: ~/idp/create-client.sh ferun ferun
apiVersion: v1
kind: Namespace
metadata:
  name: ferun
