# ferund's PostgreSQL (deploy/k3s/README.md).
# One PostgreSQL without a replica: a single machine's deployment (ADR
# 0015). Its volume is local-path, on the node it first ran on.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: ferun
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:17.6-alpine
          env:
            - name: POSTGRES_USER
              value: ferun
            - name: POSTGRES_DB
              value: ferun
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ferund-postgres
                  key: password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "ferun", "-d", "ferun"]
            periodSeconds: 5
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 1Gi }
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: ferun
spec:
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
