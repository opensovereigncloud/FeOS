# The shoot's issuer under the name the k3s manifests use, letsencrypt-prod,
# so that ferund's and FeChat's apply here unchanged. It answers DNS-01 at
# Cloudflare rather than HTTP-01: certificates exist before DNS points at
# the shoot. The secret cert-manager/cloudflare-api-token (key api-token)
# is a Cloudflare API token that edits the zone of DOMAIN:
#
#   kubectl -n cert-manager create secret generic cloudflare-api-token \
#     --from-literal=api-token=<token>
#   kubectl apply -f deploy/gardener/cluster.yaml
#
# For another DNS provider, its solver goes here instead.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token
              key: api-token
