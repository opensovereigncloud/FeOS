# Strimzi's operator (Apache-2.0), the Helm chart strimzi-kafka-operator
# 1.3.0 of oci://quay.io/strimzi-helm, in the namespace strimzi: it runs
# the Kafka cluster of kafka.yaml in the namespace ferun, and nothing
# else (README.md, The sink).
watchNamespaces: [ferun]
replicas: 1
resources:
  requests: {cpu: 100m, memory: 384Mi}
  limits: {memory: 384Mi}
