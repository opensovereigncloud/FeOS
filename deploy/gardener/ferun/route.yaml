# https://run.<DOMAIN>: ferund's front doors on the cluster's Gateway,
# whose HTTPS listener for the host holds the certificate and admits this
# namespace's routes (README.md, Prerequisites). It takes the place of
# k3s's ingress.yaml here. The nodes' port never goes through here.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ferund
  namespace: ferun
spec:
  parentRefs:
    - name: ${GATEWAY_NAME}
      namespace: ${GATEWAY_NAMESPACE}
  hostnames:
    - run.${DOMAIN}
  rules:
    - backendRefs: [{name: ferund, port: 8100}]
