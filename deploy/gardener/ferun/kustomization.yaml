# ferund and its PostgreSQL on the Gardener shoot: the k3s lab's manifests
# (deploy/k3s/ferun), with the nodes' port at an address of the shoot's
# service network, 100.72.0.0/13. They live outside this directory, so:
#
#   kubectl kustomize --load-restrictor LoadRestrictionsNone deploy/gardener/ferun | kubectl apply -f -
#
# (make -C deploy/gardener apply-ferun.)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../k3s/ferun/namespace.yaml
  - ../../k3s/ferun/postgres.yaml
  - ../../k3s/ferun/ferund.yaml
  - ../../k3s/ferun/ingress.yaml
patches:
  # feos-node's CONTROL_PLANE (deploy/gardener/feos/feos.yaml).
  - target:
      kind: Service
      name: ferund-nodes
    patch: |-
      - op: replace
        path: /spec/clusterIP
        value: 100.72.70.70
  # A feos-node pod's stop suspends its microVMs (terminationGracePeriodSeconds
  # 300) and the next one resumes them before it connects (ADR 0020): calls
  # wait for the node that long instead of failing. Below --lost-grace
  # (10 min).
  - target:
      kind: Deployment
      name: ferund
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: FERUN_ROLLOUT_GRACE
          value: 8m
