name: FeOS Lint

on:
  push:
  pull_request:

# A pull request from a branch of this repository is tested by the push
# of that branch already; pull requests run the jobs for forks only.

jobs:
  lint:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Protobuf Compiler
        run: sudo apt-get update && sudo apt-get install protobuf-compiler -y

      - name: Install Rust Toolchain
        # Installs the toolchain rust-toolchain.toml pins.
        run: rustup toolchain install

      - name: Set up cargo cache
        uses: actions/cache@v4
        continue-on-error: false
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Check Format
        run: make fmt-check

      - name: Clippy
        run: make clippy
