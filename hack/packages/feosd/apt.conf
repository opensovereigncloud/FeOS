// Installed by feosd. apt autoremove keeps every version of Firecracker
// and of the guest: a suspended VM resumes only with the Firecracker it
// ran in, and a VM that was created boots the guest it was created with.
// Remove a version that nothing uses with apt remove.
APT::NeverAutoRemove {
  "^feos-firecracker-[0-9]";
  "^feos-guest-[0-9]";
};
