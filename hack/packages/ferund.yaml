# nfpm configuration of the ferund package (ADR 0009, ADR 0015). make
# packages sets the variables.
name: ferund
arch: amd64
platform: linux
version: ${FEOS_VERSION}
section: admin
priority: optional
maintainer: IronCore authors <ospo@sap.com>
vendor: SAP SE
homepage: https://github.com/ironcore-dev/FeOS
license: Apache-2.0
# The OIDC provider's and the image registries' TLS.
depends:
  - ca-certificates
description: |-
  FeRun control plane
  ferund is FeOS's control plane: tenants, sandboxes, placement on nodes,
  idle policies, the REST API, MCP, the management UI and the ports of
  sandboxes, over PostgreSQL. Nodes running feosd connect to it over mTLS.
  This package runs one instance under systemd, for a single machine or
  beside others on one database.
contents:
  - src: ${GO_OUT}/ferund
    dst: /usr/bin/ferund
    expand: true
    file_info:
      mode: 0755
  - src: hack/packages/ferund/ferund.service
    dst: /usr/lib/systemd/system/ferund.service
    file_info:
      mode: 0644
  - src: hack/packages/ferund/ferund.sysusers
    dst: /usr/lib/sysusers.d/ferund.conf
    file_info:
      mode: 0644
  - src: hack/packages/ferund/ferund.env
    dst: /etc/ferun/ferund.env
    type: config|noreplace
    file_info:
      mode: 0640
  - dst: /etc/ferun/ca
    type: dir
    file_info:
      mode: 0750
scripts:
  postinstall: hack/packages/ferund/postinst
  preremove: hack/packages/ferund/prerm
  postremove: hack/packages/ferund/postrm
